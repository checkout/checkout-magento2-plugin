<style>
    .cko-flow-wallet .payment-method-title .label {
        display: inline-flex;
        align-items: center;
        gap: 12px;
    }
    .cko-flow-wallet .cko-method-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 26px;
        flex: 0 0 auto;
        border: 1px solid #e0e0e0;
        border-radius: 5px;
        background: #fff;
        padding: 2px;
    }
    .cko-flow-wallet .cko-method-icon .cko-method-logo {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
    }
</style>

<div class="payment-method cko-flow-wallet"
     data-bind="visible: walletAvailable, css: {'_active': (getCode() == isChecked())}, attr: {'id': getCode() + '_container', afterRender: initEvents()}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode(), 'aria-label': getTitle()}, value: getCode(), checked: isChecked, click: selectPaymentMethod"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span class="cko-method-icon" data-bind="html: getMethodLogo()"></span>
            <span data-bind="i18n: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content">
        <!-- Messages -->
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <div class="message message-cko" data-bind="attr: {'id': (getCode()+'_message')}"></div>

        <!-- Agreements form -->
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <!-- The wallet renders its own native pay button here. -->
        <div data-bind="attr: {'id': getCode() + '_wallet_container'}"></div>
    </div>
</div>
