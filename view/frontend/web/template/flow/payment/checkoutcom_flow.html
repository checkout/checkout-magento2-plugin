<style>
    #checkoutcom_flow_container .cko-flow-method-radio {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
        color: #1a1a1a;
    }
    #checkoutcom_flow_container .cko-flow-method-radio input[type="radio"] {
        margin: 0;
        flex: 0 0 auto;
    }
    /* Method logo chip (mirrors the native Flow list row) */
    #checkoutcom_flow_container .cko-method-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 26px;
        flex: 0 0 auto;
        border: 1px solid #e0e0e0;
        border-radius: 5px;
        color: #4a4a4a;
        background: #fff;
        padding: 2px;
    }
    #checkoutcom_flow_container .cko-method-icon .cko-method-logo {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
    }
    #checkoutcom_flow_container .cko-method-container:empty {
        display: none;
    }
    #checkoutcom_flow_container .cko-method-container {
        margin-top: 12px;
    }

    /* Nested list (Card + each APM) shown under the "Pay with Checkout.com" parent radio:
       a bordered box with one row per method, like the reference screenshot. */
    #checkoutcom_flow_container .cko-nested-list {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    #checkoutcom_flow_container .cko-nested-list .cko-flow-method {
        padding: 14px 16px;
        border-bottom: 1px solid #e0e0e0;
    }
    #checkoutcom_flow_container .cko-nested-list .cko-flow-method:last-child {
        border-bottom: 0;
    }
</style>

<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}, attr: {'id': getCode() + '_container', afterRender: initEvents()}">
    <!-- Parent "Pay with Checkout.com" radio. Selecting it reveals the nested Card + APM radios
         and (aligned with this radio) the Google Pay / Apple Pay radios. -->
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="i18n: getTitle()"></span>
        </label>

    </div>
    <div class="payment-method-content">
        <!-- Messages -->
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <div class="message message-cko" data-bind="attr: {'id': (getCode()+'_message')}"></div>
        <div class="message message-response-code" data-bind="attr: {'id': (getCode()+'_message')}"></div>
        <div class="message debug-message" data-bind="attr: {'id': (getCode()+'_message')}"></div>
        <!-- Nested list under the parent: Card + one radio per available APM. -->
        <div class="cko-flow-methods cko-nested-list">
            <!-- Card -->
            <div class="cko-flow-method" data-bind="visible: cardAvailable">
                <label for="cko-flow-card" class="cko-flow-method-radio">
                    <input type="radio"
                           id="cko-flow-card"
                           name="cko-flow-method"
                           value="card"
                           aria-label="Credit / Debit Card"
                           data-bind="checked: selectedFlowMethod" />
                    <span class="cko-method-icon" data-bind="html: methodIcon('card')"></span>
                    <span data-bind="i18n: 'Credit / Debit Card'">Credit / Debit Card</span>
                </label>
                <div id="flow-card-container"
                     class="cko-method-container cko-card"
                     data-bind="visible: selectedFlowMethod() === 'card'"></div>
            </div>

            <!-- One radio per available APM (iDEAL, Klarna, PayPal, SEPA, ...) -->
            <!-- ko foreach: availableApms -->
            <div class="cko-flow-method">
                <label class="cko-flow-method-radio" data-bind="attr: {for: 'cko-flow-' + type}">
                    <input type="radio"
                           name="cko-flow-method"
                           data-bind="checked: $parent.selectedFlowMethod, value: type, attr: {id: 'cko-flow-' + type, 'aria-label': label}" />
                    <span class="cko-method-icon" data-bind="html: $parent.methodIcon(type)"></span>
                    <span data-bind="text: label"></span>
                </label>
                <div class="cko-method-container"
                     data-bind="attr: {id: 'flow-apm-' + type}, visible: $parent.selectedFlowMethod() === type"></div>
            </div>
            <!-- /ko -->
        </div>


        <!-- ko foreach: $parent.getRegion('flow-saved-card') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->

        <!-- Billing -->
        <!-- <div class="payment-method-billing-address"> -->
        <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <!-- </div> -->

        <!-- Agreements form -->
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="actions-toolbar" data-bind="visible: selectedFlowMethod() === 'card'">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order'), 'id': buttonId},
                        enable: (getCode() == isChecked()),
                        css: {disabled: !isPlaceOrderActionAllowed() || !allowPlaceOrder()}
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
